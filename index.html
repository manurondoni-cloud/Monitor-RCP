<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monitor RCP Pro</title>
    
    <!-- Metadatos PWA (sin cambios) -->
    <link rel="manifest" href="data:application/manifest+json;base64,..."> <!-- Mantener el manifest original -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- ESTILOS GENERALES (la mayoría sin cambios) --- */
        :root {
            --bg-color: #121212; --primary-color: #1e1e1e; --secondary-color: #2c2c2c;
            --text-color: #e0e0e0; --accent-color: #03a9f4; --accent-hover: #039be5;
            --good-color: #4caf50; --warn-color: #ffc107; --bad-color: #f44336;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .main-container { width: 100%; max-width: 900px; text-align: center; }
        header, #connection-area, .spinner, .button, #status, nav, .nav-button { /* Sin cambios */ }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        #shared-ui-container, .visuals-grid, .viz-container, .depth-container, .rate-gauge-container, .feedback-grid { /* Sin cambios */ }

        /* CAMBIO: Se eliminan 'bottom' y 'height' del CSS para que JS los controle */
        #depth-bar-ideal {
            position: absolute;
            left: 0;
            width: 100%;
            background: rgba(76, 175, 80, 0.3);
            transition: bottom 0.3s ease, height 0.3s ease; /* Transición suave */
        }
        #depth-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0; background: var(--accent-color); transition: height 0.1s linear, background-color 0.2s; }
        
        /* CAMBIO: Estilos para los nuevos controles de evaluación */
        #evaluation-controls { text-align: center; }
        #time-selection-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .time-button {
            padding: 10px 20px;
            font-size: 1em;
            background-color: var(--secondary-color);
            border: 1px solid #444;
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .time-button.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-hover);
        }

        /* Resto de estilos sin cambios */
        #mode-settings, .settings-group, .setting-item, #chart-container, #results-modal, #results-content, #final-score { /* Sin cambios */ }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <!-- Header sin cambios -->
             <h1>Monitor RCP Pro</h1>
            <div id="connection-area">
                <div class="spinner" id="spinner"></div>
                <button class="button" id="connect-button">Conectar al Sensor</button>
            </div>
            <p id="status">Desconectado</p>
        </header>

        <nav id="mode-nav" style="display: none;">
            <button class="nav-button active" data-mode="free">Práctica Libre</button>
            <button class="nav-button" data-mode="evaluation">Evaluación</button>
            <button class="nav-button" data-mode="raw">Datos en Vivo</button>
            <button class="nav-button" data-mode="settings">Ajustes</button>
        </nav>

        <main>
            <div id="shared-ui-container" style="display: none;">
                 <div class="visuals-grid">
                    <div class="viz-container">
                        <h2>Profundidad</h2>
                        <div class="depth-container">
                            <div id="depth-bar-ideal"></div>
                            <div id="depth-bar-fill"></div>
                        </div>
                    </div>
                    <!-- Resto de UI compartida sin cambios -->
                 </div>
                 <!-- ... -->
            </div>

            <div id="mode-free" class="mode-content active"></div>
            
            <!-- CAMBIO: Contenido del modo Evaluación actualizado -->
            <div id="mode-evaluation" class="mode-content">
                 <div id="evaluation-controls">
                    <p>Selecciona la duración de la prueba:</p>
                    <div id="time-selection-buttons">
                        <button class="time-button" data-time="30">30 seg</button>
                        <button class="time-button" data-time="60">1 min</button>
                        <button class="time-button" data-time="120">2 min</button>
                    </div>
                    <button id="start-eval-button" class="button" disabled>Iniciar Evaluación</button>
                </div>
                <div id="timer-display" style="display: none;">2:00</div>
            </div>
            
            <div id="mode-raw" class="mode-content">
                <!-- Modo Datos en vivo sin cambios -->
            </div>

            <div id="mode-settings" class="mode-content">
                <!-- Modo Ajustes sin cambios -->
            </div>
        </main>
    </div>

    <div id="results-modal">
        <!-- Modal de resultados sin cambios -->
    </div>

    <script>
        // --- ESTADO DE LA APLICACIÓN (con nueva propiedad) ---
        const AppState = {
            // ... (propiedades anteriores)
            selectedEvalTime: 0, // CAMBIO: Para guardar el tiempo de evaluación
            ui: { currentDepthHeight: 0, currentRateAngle: -90 }
        };

        // --- REFERENCIAS AL DOM (con nuevas referencias) ---
        const DOM = {
            // ... (elementos anteriores)
            depthIdealBar: document.getElementById('depth-bar-ideal'), // CAMBIO
            timeSelectionButtons: document.querySelectorAll('.time-button'), // CAMBIO
            rateMaxValue: document.getElementById('rate-max-value'),
        };

        // --- CONSTANTES Y AJUSTES (sin cambios) ---
        const BLE = { /* ... */ };
        let RANGES = { /* ... */ };

        // --- LÓGICA DE CONEXIÓN BLE (sin cambios) ---
        async function connectToDevice() { /* ... */ }
        function onDisconnected() { /* ... */ }
        function resetUI() { /* ... */ }

        // --- MANEJO DE DATOS DEL SENSOR (sin cambios) ---
        function handleFeedback(event) { /* ... */ }
        function handleRawData(event) { /* ... */ }

        // --- BUCLE DE ANIMACIÓN Y ACTUALIZACIÓN DE UI (sin cambios) ---
        function animationLoop() { /* ... */ }
        function updateCard(card, text, state) { /* ... */ }
        
        // --- LÓGICA DE MODOS Y EVALUACIÓN (con cambios) ---
        DOM.navButtons.forEach(button => {
            // ... (lógica de navegación sin cambios)
        });
        
        // CAMBIO: Lógica para los nuevos botones de tiempo
        DOM.timeSelectionButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Quita la clase activa de todos los botones
                DOM.timeSelectionButtons.forEach(btn => btn.classList.remove('active'));
                // Añade la clase al botón clicado
                button.classList.add('active');
                // Guarda el tiempo seleccionado
                AppState.selectedEvalTime = parseInt(button.dataset.time, 10);
                // Habilita el botón de iniciar
                DOM.startEvalButton.disabled = false;
            });
        });

        function startEvaluation() {
            // CAMBIO: Usa el tiempo seleccionado en lugar de un valor fijo
            if (!AppState.selectedEvalTime || AppState.selectedEvalTime <= 0) {
                alert("Por favor, selecciona una duración para la evaluación.");
                return;
            }

            AppState.isEvaluationRunning = true;
            [DOM.startEvalButton, DOM.connectButton, ...DOM.navButtons, ...DOM.timeSelectionButtons].forEach(b => b.disabled = true);
            DOM.evalControls.style.display = 'none';
            DOM.timerDisplay.style.display = 'block';
            DOM.sharedUiContainer.style.display = 'block';
            AppState.evalStats = { totalCompressions: 0, goodDepth: 0, goodRate: 0, goodRecoil: 0, goodPosition: 0 };
            
            let timeLeft = AppState.selectedEvalTime; // Usa el tiempo guardado
            
            const updateTimerDisplay = () => {
                DOM.timerDisplay.textContent = `${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
            };
            
            updateTimerDisplay(); // Muestra el tiempo inicial
            AppState.evaluationTimer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) endEvaluation(false);
            }, 1000);
        }

        function endEvaluation(cancelled) {
            // ... (código interno sin cambios)
            // Reactivar botones de tiempo
            DOM.timeSelectionButtons.forEach(b => b.disabled = false);
            DOM.startEvalButton.disabled = true; // Deshabilitar hasta nueva selección
            DOM.timeSelectionButtons.forEach(btn => btn.classList.remove('active'));
        }

        function updateEvaluationStats() { /* ... */ }
        
        // --- LÓGICA PARA GRÁFICOS Y AJUSTES ---
        let realtimeChart;
        function initializeChart() { /* ... */ }
        function updateChart(value) { /* ... */ }
        
        function setupSettings() {
            const sliders = [
                { el: DOM.depthMinSlider, valEl: DOM.depthMinValue, obj: RANGES.depth, key: 'min' }, 
                { el: DOM.depthMaxSlider, valEl: DOM.depthMaxValue, obj: RANGES.depth, key: 'max' },
                // ... (otros sliders)
            ];

            sliders.forEach(({ el, valEl, obj, key }) => {
                el.addEventListener('input', () => { 
                    const value = parseFloat(el.value); 
                    obj[key] = value; 
                    valEl.textContent = value; 
                    saveSettings(); 

                    // CAMBIO: Si es un slider de profundidad, actualiza la visualización
                    if (key === 'min' || key === 'max') {
                        updateIdealZoneVisual();
                    }
                });
            });
            loadSettings();
        }

        function saveSettings() { /* ... */ }

        function loadSettings() {
            const saved = localStorage.getItem('rcpAppSettings');
            if (saved) { RANGES = JSON.parse(saved); }
            // ... (actualizar UI de sliders)
            
            // CAMBIO: Llama a la función para actualizar la barra verde al cargar
            updateIdealZoneVisual();
        }

        // CAMBIO: Nueva función para actualizar la barra de zona ideal
        function updateIdealZoneVisual() {
            const scale = RANGES.depth.scale;
            const min = RANGES.depth.min;
            const max = RANGES.depth.max;

            if (scale > 0 && max > min) {
                const bottomPercent = (min / scale) * 100;
                const heightPercent = ((max - min) / scale) * 100;
                
                DOM.depthIdealBar.style.bottom = `${bottomPercent}%`;
                DOM.depthIdealBar.style.height = `${heightPercent}%`;
            }
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeChart();
            setupSettings();
            requestAnimationFrame(animationLoop);

            DOM.connectButton.addEventListener('click', connectToDevice);
            DOM.startEvalButton.addEventListener('click', startEvaluation);
            DOM.closeModalButton.addEventListener('click', () => { DOM.resultsModal.style.display = 'none'; });
        });
    </script>
</body>
</html>
