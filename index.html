<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monitor RCP Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #121212; --primary-color: #1e1e1e; --secondary-color: #2c2c2c;
            --text-color: #e0e0e0; --accent-color: #03a9f4; --accent-hover: #039be5;
            --good-color: #4caf50; --warn-color: #ffc107; --bad-color: #f44336;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .main-container { width: 100%; max-width: 900px; text-align: center; }
        header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--secondary-color); }
        #connection-area { display: flex; align-items: center; gap: 15px; margin: 10px 0; }
        .spinner { width: 24px; height: 24px; border: 3px solid #555; border-top-color: var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .button { background-color: var(--accent-color); color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 8px; cursor: pointer; transition: background-color 0.3s, opacity 0.3s; }
        .button:hover { background-color: var(--accent-hover); }
        .button:disabled { background-color: #555; cursor: not-allowed; opacity: 0.7; }
        #status { font-style: italic; color: #aaa; min-height: 1.5em; }
        nav { display: none; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .nav-button { padding: 10px 20px; background: var(--secondary-color); border: 1px solid #444; color: var(--text-color); cursor: pointer; border-radius: 8px; transition: all 0.3s; }
        .nav-button.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .nav-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        #shared-ui-container { display: none; }
        .visuals-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin: 25px 0; }
        @media (min-width: 768px) { .visuals-grid { grid-template-columns: 1fr 1fr; } }
        .viz-container { background: var(--primary-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; }
        .depth-container { width: 80px; height: 220px; background: var(--secondary-color); border-radius: 10px; position: relative; overflow: hidden; border: 2px solid #444; }
        #depth-bar-ideal { position: absolute; left: 0; width: 100%; background: rgba(76, 175, 80, 0.3); transition: bottom 0.3s ease, height 0.3s ease; }
        #depth-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0; background: var(--accent-color); transition: height 0.1s linear, background-color 0.2s; }
        .rate-gauge-container { display: flex; flex-direction: column; align-items: center; }
        .rate-gauge { width: 220px; height: 110px; position: relative; overflow: hidden; }
        .rate-gauge-bg { width: 100%; height: 100%; border-radius: 220px 220px 0 0; background: conic-gradient(from -90deg, var(--bad-color) 0 35deg, var(--warn-color) 35deg 70deg, var(--good-color) 70deg 110deg, var(--warn-color) 110deg 145deg, var(--bad-color) 145deg 180deg); }
        .rate-gauge-cover { width: 180px; height: 90px; background: var(--primary-color); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 180px 180px 0 0; }
        #rate-needle { width: 2px; height: 95px; background: var(--text-color); position: absolute; bottom: 0; left: 50%; transform-origin: bottom center; transition: transform 0.2s ease-out; }
        #rate-value { font-size: 2em; font-weight: bold; margin-top: -35px; position: relative; }
        .feedback-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .feedback-card { background: var(--secondary-color); border-radius: 10px; padding: 15px; border-bottom: 4px solid #555; transition: border-color 0.3s; }
        .feedback-card h3 { margin-top: 0; color: #ccc; font-size: 1em; }
        .feedback-card p { font-size: 1.4em; font-weight: bold; margin: 0; min-height: 1.2em; }
        .good { border-color: var(--good-color); }
        .bad { border-color: var(--bad-color); }
        .settings-group { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--secondary-color); }
        .settings-group:last-child { border-bottom: none; }
        h2, h3 { color: var(--accent-color); margin-top: 0; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
        .setting-item label { flex-basis: 100%; margin-bottom: 5px; text-align: left; }
        @media (min-width: 600px) { .setting-item label { flex-basis: 40%; } }
        .setting-item input[type="range"] { flex-grow: 1; margin: 0 15px; }
        .setting-item span { font-weight: bold; min-width: 50px; text-align: right; }
        #chart-container { width: 100%; height: 300px; background: var(--primary-color); border-radius: 12px; padding: 15px; box-sizing: border-box; margin-top: 20px; }
        #results-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        #results-content { background: var(--primary-color); padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 500px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        #final-score { font-size: 5em; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
        /* --- ESTILOS NUEVOS PARA CALIBRACIÓN --- */
        #calibration-step-display { padding: 20px; background: var(--primary-color); border-radius: 12px; }
        #calibration-instruction { font-size: 1.2em; }
        #calibration-progress { font-size: 2.5em; font-weight: bold; margin: 10px 0; color: var(--accent-color); }
        #calibration-suggestion { display: none; margin-top: 25px; padding: 20px; background: var(--primary-color); border-left: 5px solid var(--accent-color); text-align: left; }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Monitor RCP Pro</h1>
            <div id="connection-area">
                <div class="spinner" id="spinner"></div>
                <button class="button" id="connect-button">Conectar al Sensor</button>
            </div>
            <p id="status">Desconectado</p>
        </header>

        <nav id="mode-nav">
            <button class="nav-button active" data-mode="free">Práctica Libre</button>
            <button class="nav-button" data-mode="evaluation">Evaluación</button>
            <button class="nav-button" data-mode="calibration">Calibración</button>
            <button class="nav-button" data-mode="raw">Datos en Vivo</button>
            <button class="nav-button" data-mode="settings">Ajustes</button>
        </nav>

        <main>
            <div id="shared-ui-container">
                <!-- (Contenido de UI compartida sin cambios) -->
            </div>

            <div id="mode-free" class="mode-content active"></div>
            <div id="mode-evaluation" class="mode-content">
                <!-- (Contenido del modo Evaluación sin cambios) -->
            </div>

            <div id="mode-calibration" class="mode-content">
                <h2>Calibración Relativa de Profundidad</h2>
                <div id="calibration-step-display">
                    <p id="calibration-instruction">Presiona "Iniciar" para comenzar el proceso de calibración.</p>
                    <p id="calibration-progress"></p>
                </div>
                <div id="calibration-controls" style="margin-top: 20px;">
                    <button id="start-calibration-button" class="button">Iniciar Calibración</button>
                </div>
                <div id="calibration-suggestion"></div>
            </div>

            <div id="mode-raw" class="mode-content">
                 <!-- (Contenido del modo Raw sin cambios) -->
            </div>
            
            <div id="mode-settings" class="mode-content">
                 <!-- (Contenido del modo Ajustes sin cambios) -->
            </div>
        </main>
    </div>
    
    <!-- (El modal de resultados no se copia aquí por brevedad, no tiene cambios) -->

    <script>
        // --- ESTADO DE LA APLICACIÓN ---
        const AppState = {

            ui: { currentDepthHeight: 0, currentRateAngle: -90, currentRate: 0 },

                isActive: false, step: 'idle', // 'idle', 'shallow', 'good', 'deep', 'done'
                counts: { shallow: 0, good: 0, deep: 0 },
                data: { shallow: [], good: [], deep: [] }
            }
        };

        // --- REFERENCIAS AL DOM ---
        const DOM = {
            connectButton: document.getElementById('connect-button'), statusDisplay: document.getElementById('status'), spinner: document.getElementById('spinner'),
            modeNav: document.getElementById('mode-nav'), navButtons: document.querySelectorAll('.nav-button'), modeContents: document.querySelectorAll('.mode-content'),
            sharedUiContainer: document.getElementById('shared-ui-container'),
            // --- NUEVOS Elementos de Calibración ---
            calibrationStepDisplay: document.getElementById('calibration-step-display'),
            calibrationInstruction: document.getElementById('calibration-instruction'),
            calibrationProgress: document.getElementById('calibration-progress'),
            calibrationControls: document.getElementById('calibration-controls'),
            startCalibrationButton: document.getElementById('start-calibration-button'),
            calibrationSuggestion: document.getElementById('calibration-suggestion'),
            // (El resto de los elementos DOM no se listan por brevedad pero están en tu código original)
        };

        // --- CONSTANTES Y AJUSTES ---
        const BLE = {
            SERVICE_UUID: "4fafc201-1fb5-459e-8fcc-c5c9c331
