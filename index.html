<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Monitor RCP Pro</title>
    
    <!-- Metadatos PWA (sin cambios) -->
    <meta name="theme-color" content="#1e1e1e"/>
    <link rel="manifest" href="data:application/manifest+json;base64,..."> <!-- Mantener el manifest original -->
    
    <!-- CAMBIO: Añadir librería para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- ESTILOS GENERALES (la mayoría sin cambios) --- */
        :root {
            --bg-color: #121212; --primary-color: #1e1e1e; --secondary-color: #2c2c2c;
            --text-color: #e0e0e0; --accent-color: #03a9f4; --accent-hover: #039be5;
            --good-color: #4caf50; --warn-color: #ffc107; --bad-color: #f44336;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
        }
        .main-container { width: 100%; max-width: 900px; text-align: center; }
        header, #connection-area, .spinner, .button, #status, nav, .nav-button { /* Sin cambios */ }
        .mode-content { display: none; }
        .mode-content.active { display: block; }
        .visuals-grid, .viz-container, .depth-container, .rate-gauge-container, .feedback-grid { /* Sin cambios */ }
        footer { /* Sin cambios */ }

        /* --- CAMBIO: Estilos para la nueva pestaña de Ajustes --- */
        #mode-settings {
            background: var(--primary-color);
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            text-align: left;
        }
        .settings-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--secondary-color);
        }
        .settings-group:last-child { border-bottom: none; }
        .settings-group h3 { margin-top: 0; color: var(--accent-color); }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .setting-item label { flex-basis: 40%; }
        .setting-item input[type="range"] {
            flex-grow: 1;
            margin: 0 15px;
        }
        .setting-item span { font-weight: bold; min-width: 50px; text-align: right; }

        /* --- CAMBIO: Estilo para el contenedor del gráfico --- */
        #chart-container {
            width: 100%;
            height: 300px; /* Altura del gráfico */
            background: var(--primary-color);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Monitor RCP Pro</h1>
            <div id="connection-area">
                <div class="spinner" id="spinner"></div>
                <button class="button" id="connect-button">Conectar al Sensor</button>
            </div>
            <p id="status">Desconectado</p>
        </header>

        <!-- CAMBIO: Añadido botón de Ajustes -->
        <nav id="mode-nav" style="display: none;">
            <button class="nav-button active" data-mode="free">Práctica Libre</button>
            <button class="nav-button" data-mode="evaluation">Evaluación</button>
            <button class="nav-button" data-mode="raw">Datos en Vivo</button>
            <button class="nav-button" data-mode="settings">Ajustes</button>
        </nav>

        <main>
            <div id="shared-ui-container" style="display: none;">
                <!-- UI Compartida (sin cambios) -->
            </div>
            
            <div id="mode-free" class="mode-content active"></div>
            <div id="mode-evaluation" class="mode-content">
                <!-- Modo Evaluación (sin cambios) -->
            </div>
            
            <!-- CAMBIO: Contenido de la pestaña de datos en vivo -->
            <div id="mode-raw" class="mode-content">
                <h2>Gráfico de Aceleración en Tiempo Real</h2>
                <div id="chart-container">
                    <canvas id="realtime-chart"></canvas>
                </div>
            </div>

            <!-- CAMBIO: Nueva pestaña de Ajustes -->
            <div id="mode-settings" class="mode-content">
                <div class="settings-group">
                    <h3>Profundidad (Valores de Aceleración)</h3>
                    <div class="setting-item">
                        <label for="depth-min-slider">Mínimo Correcto:</label>
                        <input type="range" id="depth-min-slider" min="5000" max="12000" step="100">
                        <span id="depth-min-value">0</span>
                    </div>
                    <div class="setting-item">
                        <label for="depth-max-slider">Máximo Correcto:</label>
                        <input type="range" id="depth-max-slider" min="12000" max="20000" step="100">
                        <span id="depth-max-value">0</span>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Ritmo (Compresiones por Minuto)</h3>
                    <div class="setting-item">
                        <label for="rate-min-slider">Mínimo Correcto:</label>
                        <input type="range" id="rate-min-slider" min="80" max="110" step="1">
                        <span id="rate-min-value">0</span>
                    </div>
                     <div class="setting-item">
                        <label for="rate-max-slider">Máximo Correcto:</label>
                        <input type="range" id="rate-max-slider" min="110" max="140" step="1">
                        <span id="rate-max-value">0</span>
                    </div>
                </div>
            </div>
        </main>
        
        <footer><!-- Sin cambios --></footer>
    </div>

    <div id="results-modal"><!-- Sin cambios --></div>

    <script>
        // --- ESTADO DE LA APLICACIÓN (sin cambios) ---
        const AppState = { /* ... */ };

        // --- REFERENCIAS AL DOM (Añadir nuevas) ---
        const DOM = {
            // ... (elementos anteriores)
            chartCanvas: document.getElementById('realtime-chart'),
            // Sliders de ajustes
            depthMinSlider: document.getElementById('depth-min-slider'),
            depthMaxValue: document.getElementById('depth-max-value'),
            depthMaxSlider: document.getElementById('depth-max-slider'),
            depthMinValue: document.getElementById('depth-min-value'),
            rateMinSlider: document.getElementById('rate-min-slider'),
            rateMinValue: document.getElementById('rate-min-value'),
            rateMaxSlider: document.getElementById('rate-max-slider'),
            rateMaxValue: document.getElementById('rate-max-value'),
        };

        // --- CONSTANTES BLE (sin cambios) ---
        const BLE = { /* ... */ };

        // --- CAMBIO: RANGES AHORA ES CONFIGURABLE ---
        let RANGES = {
            depth: { min: 9500, max: 13500, scale: 18000 },
            recoil: { min: 1 }, // Ahora es binario: 1 = bueno
            rate: { min: 100, max: 120, scale: 240 }
        };

        // --- LÓGICA DE CONEXIÓN BLE (Solo un cambio en el nombre de la función handler) ---
        async function connectToDevice() {
            // ... (código igual)
                const feedbackChar = await service.getCharacteristic(BLE.FEEDBACK_UUID);
                await feedbackChar.startNotifications();
                feedbackChar.addEventListener('characteristicvaluechanged', handleFeedback);
                
                const rawDataChar = await service.getCharacteristic(BLE.RAW_DATA_UUID);
                await rawDataChar.startNotifications();
                // CAMBIO: Nombre de la función
                rawDataChar.addEventListener('characteristicvaluechanged', handleRawData);
            // ... (resto igual)
        }

        // --- MANEJO DE DATOS DEL SENSOR (ACTUALIZADO) ---
        function handleFeedback(event) {
            const value = new TextDecoder().decode(event.target.value);
            // CAMBIO: El formato de datos es nuevo
            const [peakAccel, fullRecoil, rate, isStraight] = value.split(',').map(Number);
            AppState.latestData = { 
                depth: Math.abs(peakAccel), 
                recoil: fullRecoil, // Es 1 para bueno, 0 para malo
                rate, 
                pos: isStraight 
            };
            if (AppState.isEvaluationRunning) updateEvaluationStats();
        }

        // CAMBIO: Nueva función para manejar datos para la gráfica
        function handleRawData(event) {
            const value = new TextDecoder().decode(event.target.value);
            const accelValue = parseFloat(value);
            updateChart(accelValue);
        }

        // --- BUCLE DE ANIMACIÓN Y ACTUALIZACIÓN DE UI (ACTUALIZADO) ---
        function animationLoop() {
            const data = AppState.latestData;
            // ... (lógica de suavizado de barra de profundidad y aguja de ritmo sin cambios)

            // CAMBIO: Lógica de feedback de tarjetas actualizada
            let depthState = 'good', depthMsg = 'Correcto';
            if (data.depth > RANGES.depth.max) { depthState = 'bad'; depthMsg = 'Muy Profundo'; }
            else if (data.depth < RANGES.depth.min) { depthState = 'bad'; depthMsg = 'Insuficiente'; }
            DOM.depthFill.style.backgroundColor = `var(--${depthState}-color)`;
            updateCard(DOM.depthCard, depthMsg, depthState);
            
            // CAMBIO: El recoil ahora es binario
            let recoilState = data.recoil === 1 ? 'good' : 'bad';
            updateCard(DOM.recoilCard, recoilState === 'good' ? 'Completa' : 'Incompleta', recoilState);
            
            let posState = data.pos === 1 ? 'good' : 'bad';
            updateCard(DOM.positionCard, posState === 'good' ? 'Correcta' : 'Incorrecta', posState);

            requestAnimationFrame(animationLoop);
        }

        function updateCard(card, text, state) { /* Sin cambios */ }
        
        // --- LÓGICA DE MODOS Y EVALUACIÓN (UI actualizada) ---
        DOM.navButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (AppState.isEvaluationRunning) return;
                const targetMode = button.dataset.mode;
                // ... (lógica de cambio de clases igual)
                DOM.sharedUiContainer.style.display = (targetMode === 'raw' || targetMode === 'settings') ? 'none' : 'block';
            });
        });

        // --- CAMBIO: Lógica de la evaluación actualizada ---
        function updateEvaluationStats() {
            const data = AppState.latestData;
            AppState.evalStats.total++;
            if (data.depth >= RANGES.depth.min && data.depth <= RANGES.depth.max) AppState.evalStats.goodDepth++;
            if (data.rate >= RANGES.rate.min && data.rate <= RANGES.rate.max) AppState.evalStats.goodRate++;
            if (data.recoil === 1) AppState.evalStats.goodRecoil++; // Recoil es 1 o 0
            if (data.pos === 1) AppState.evalStats.goodPosition++;
        }
        
        // --- CAMBIO: NUEVA LÓGICA PARA GRÁFICOS Y AJUSTES ---
        let realtimeChart;

        function initializeChart() {
            const ctx = DOM.chartCanvas.getContext('2d');
            realtimeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(50).fill(''),
                    datasets: [{
                        label: 'Aceleración Vertical',
                        data: Array(50).fill(0),
                        borderColor: 'rgb(3, 169, 244)',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4
                    }]
                },
                options: {
                    animation: false,
                    scales: {
                        y: { min: -20000, max: 20000, ticks: { color: '#888' } },
                        x: { ticks: { display: false } }
                    },
                    plugins: { legend: { display: false } },
                    maintainAspectRatio: false
                }
            });
        }

        function updateChart(value) {
            if (!realtimeChart) return;
            realtimeChart.data.datasets[0].data.push(value);
            realtimeChart.data.datasets[0].data.shift();
            realtimeChart.update();
        }

        function setupSettings() {
            const sliders = [
                { el: DOM.depthMinSlider, valEl: DOM.depthMinValue, obj: RANGES.depth, key: 'min' },
                { el: DOM.depthMaxSlider, valEl: DOM.depthMaxValue, obj: RANGES.depth, key: 'max' },
                { el: DOM.rateMinSlider,  valEl: DOM.rateMinValue,  obj: RANGES.rate,  key: 'min' },
                { el: DOM.rateMaxSlider,  valEl: DOM.rateMaxValue,  obj: RANGES.rate,  key: 'max' },
            ];

            sliders.forEach(({ el, valEl, obj, key }) => {
                el.addEventListener('input', () => {
                    const value = parseFloat(el.value);
                    obj[key] = value;
                    valEl.textContent = value;
                    saveSettings();
                });
            });

            loadSettings();
        }

        function saveSettings() {
            localStorage.setItem('rcpAppSettings', JSON.stringify(RANGES));
        }

        function loadSettings() {
            const saved = localStorage.getItem('rcpAppSettings');
            if (saved) {
                RANGES = JSON.parse(saved);
            }
            // Actualizar UI con los valores cargados o por defecto
            DOM.depthMinSlider.value = RANGES.depth.min;
            DOM.depthMinValue.textContent = RANGES.depth.min;
            DOM.depthMaxSlider.value = RANGES.depth.max;
            DOM.depthMaxValue.textContent = RANGES.depth.max;
            DOM.rateMinSlider.value = RANGES.rate.min;
            DOM.rateMinValue.textContent = RANGES.rate.min;
            DOM.rateMaxSlider.value = RANGES.rate.max;
            DOM.rateMaxValue.textContent = RANGES.rate.max;
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeChart();
            setupSettings();
            requestAnimationFrame(animationLoop);
        });

        // Resto de funciones (connectToDevice, startEvaluation, endEvaluation, etc.) aquí
    </script>
</body>
</html>
